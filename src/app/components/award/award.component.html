<div>
  <div class="font-semibold text-lg">
    {{ award.year }} - {{ award.name }}
  </div>
  <div class="text-gray-700">
    {{ award.eventName }} • {{ award.category }}
  </div>
  <div class="text-gray-500 md:whitespace-nowrap">
    {{ award.shower }} | {{ award.animalName }} | {{ award.location }}
  </div>

  @if (award.pictures?.length) {
    <div class="mt-3 flex flex-wrap gap-2">
      @for (pic of award.pictures; track pic; let i = $index) {
        <img [src]="pic" [alt]="award.name + ' - ' + i"
          class="w-32 h-32 object-cover rounded shadow">
      }
    </div>
  }
</div>
