<div class="flex flex-col justify-center items-center text-lg space-y-2">
  <h1 class="text-2xl font-bold text-white mt-4">Awards</h1>
  @if (this.showContent && this.awards.length > 0) {
    <app-content>
      @for (award of awards; track award) {
        <div class="md:mb-6 md:p-4 border-b border-gray-300">
          <app-award [award]="award"></app-award>
        </div>
      }
    </app-content>
  }
</div>
